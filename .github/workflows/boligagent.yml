name: boligagent
on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: boligagent
  cancel-in-progress: false
jobs:
  tjek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python boligagent.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Gem seen.json
        run: |
          git config user.name "boligagent"
          git config user.email "boligagent@users.noreply.github.com"
          git add seen.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "opdater seen"
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin main && git push origin HEAD:main; then
              exit 0
            fi
            sleep 5
          done
          exit 1
