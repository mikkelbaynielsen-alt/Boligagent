name: boligagent
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: boligagent
  cancel-in-progress: false
jobs:
  tjek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python boligagent.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Gem seen.json
        run: |
          git config user.name "boligagent"
          git config user.email "boligagent@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "opdater seen" && git push)
